{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2 class="mb-4" style="color: #8B4513;">
        <i class="fas fa-minus-circle"></i> Registrar Consumo
    </h2>

    <div class="card shadow">
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Producto</label>
                        <select class="form-select" name="producto_id" required>
                            <option value="">Selecciona un producto...</option>
                            {% for producto in productos %}
                            <option value="{{ producto.id }}">{{ producto.nombre }} ({{ producto.stock_actual }} {{ producto.unidad }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Cantidad</label>
                        <input type="number" step="0.01" class="form-control" name="cantidad" required>
                    </div>
                    
                    <div class="col-md-3 mb-3">
                        <label class="form-label">Unidad</label>
                        <input type="text" class="form-control" value="Automático" disabled>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Observación / Motivo</label>
                    <textarea class="form-control" name="observacion" rows="3" placeholder="Ej: Preparación almuerzo, Desperdicio, etc."></textarea>
                </div>

                <button type="submit" class="btn btn-danger w-100 py-3">
                    <i class="fas fa-save"></i> Registrar Consumo
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
