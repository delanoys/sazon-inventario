{% extends "base.html" %}

{% block content %}
<h2 class="mb-4" style="color: #8B4513;">
    <i class="fas fa-plus-circle"></i> Registrar Entrada de Mercancía
</h2>

<div class="card shadow">
    <div class="card-body">
        <form method="POST" id="entradaForm">
            <div class="row g-3">
                <div class="col-md-5">
                    <label class="form-label">Producto</label>
                    <input type="text" class="form-control" name="nombre" id="nombreProducto" 
                           list="productosList" placeholder="Nombre del producto" required>
                    <datalist id="productosList">
                        {% for p in productos %}
                        <option value="{{ p.nombre }}" data-unidad="{{ p.unidad }}" data-minimo="{{ p.stock_minimo }}">
                        {% endfor %}
                    </datalist>
                </div>
                
                <div class="col-md-3">
                    <label class="form-label">Unidad de Medida</label>
                    <select class="form-select" name="unidad" id="unidadSelect" required>
                        <option value="">Selecciona unidad...</option>
                        <option value="kg">Kilogramos (kg)</option>
                        <option value="g">Gramos (g)</option>
                        <option value="litros">Litros (L)</option>
                        <option value="ml">Mililitros (ml)</option>
                        <option value="unidades">Unidades</option>
                        <option value="paquetes">Paquetes</option>
                        <option value="botellas">Botellas</option>
                        <option value="cajas">Cajas</option>
                        <option value="docenas">Docenas</option>
                    </select>
                </div>
                
                <div class="col-md-2">
                    <label class="form-label">Cantidad</label>
                    <input type="number" step="0.01" class="form-control" name="cantidad" required>
                </div>
                
                <div class="col-md-2">
                    <label class="form-label">Stock Mínimo</label>
                    <input type="number" step="0.1" class="form-control" name="stock_minimo" value="5">
                </div>
                
                <div class="col-md-12 mt-3">
                    <button type="submit" class="btn btn-success btn-lg w-100">
                        <i class="fas fa-save"></i> Registrar Entrada
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('nombreProducto').addEventListener('input', function() {
    const input = this.value.trim().toLowerCase();
    const datalist = document.getElementById('productosList').options;
    
    for (let option of datalist) {
        if (option.value.toLowerCase() === input) {
            document.getElementById('unidadSelect').value = option.getAttribute('data-unidad');
            return;
        }
    }
});
</script>
{% endblock %}
